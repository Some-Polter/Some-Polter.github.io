    <main>
      <h3>Please fill out the below information to set up reservation at the Big E's Emporium</h3>
        <form class="center">
          <article class="flex">
            <legend>
              <label for="fullname">Full Name</label>
              <input type="text" id="fullname" name="name" required/>
              <label for="email">Email</label>
              <input type="text" id="email" name="email" required/>
              <label for="phone">Phone Number</label>
              <input type="text" id="phone" name="phone" required/>
              <label for="people">Number of People</label>
              <select type="acctype" id="people" name="people" size="3">
                <option value="type1">1-2</option>
                <option value="type2">3-4</option>
                <option value="type3">4+</option>
              </select>
              <label for="date">Check in</label>
              <input type="date" id="date" name="date">
              <label for="dateout">Check Out</label>
              <input type="date" id="dateout" name="date">
              <input type="submit" >
            </legend>
          </article>
        </form>
    </main>
